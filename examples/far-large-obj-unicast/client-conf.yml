default-session-authn:
  rules:
    - prin: server
      cred:
        unix: far-threads-example-server-datagram.sock

    - prin: server
      cred:
        unsafe:
          ip: '[::1]:7117'

  unsafe:
    allow-ip-addr-creds: true

channels:
  - id: client-udp
    udp:
      addr: '[::0]:7227'
      unsafe:
        allow-ip-addr-creds: true

  - id: client-unix
    unix-datagram:
      path: far-threads-example-client-datagram.sock

connections:
  - channel-names:
      - client-udp

    endpoints:
      - addr:
          udp: '[::1]:7117'

  - channel-names:
      - client-unix

    endpoints:
      - addr:
          unix-datagram: far-threads-example-server-datagram.sock

msg-authn: null
