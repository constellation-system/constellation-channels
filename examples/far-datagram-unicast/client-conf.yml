default-session-authn:
  rules:
    - prin: client
      cred:
        unix: far-threads-example-server-datagram.sock

    - prin: client
      cred:
        unsafe:
          ip: '[::1]:7227'

  unsafe:
    allow-unsafe-ip-creds: true

channels:
  - id: server-udp
    udp:
      addr: '[::0]:7117'

  - id: server-unix
    unix-datagram:
      path: far-threads-example-client-datagram.sock

connections:
  - channel-names:
      - server-udp

    endpoints:
      - addr:
          udp: '[::1]:7227'

  - channel-names:
      - server-unix

    endpoints:
      - addr:
          unix-datagram: far-threads-example-server-datagram.sock

msg-authn: null
