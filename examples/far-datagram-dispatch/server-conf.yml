default-session-authn:
  rules:
    - prin: client
      cred:
        unix: far-threads-example-client-datagram.sock

    - prin: client
      cred:
        unsafe:
          ip: '[::1]:7227'

  unsafe:
    allow-ip-addr-creds: true

channels:
  - id: server-udp
    udp:
      addr: '[::0]:7117'
      unsafe:
        allow-ip-addr-creds: true

  - id: server-unix
    unix-datagram:
      path: far-threads-example-server-datagram.sock

msg-authn: null
