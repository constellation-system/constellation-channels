default-outbound-authn:
  rules:
    - prin: server
      cred:
        unix: near-threads-example-server-large-obj.sock

    - prin: server
      cred:
        unsafe:
          ip: '[::1]:8338'

  unsafe:
    allow-ip-addr-creds: true

default-inbound-authn:
  rules: []

channels:
  - outbound:
      id: client-tcp
      tcp:
        unsafe:
          allow-ip-addr-creds: true

  - outbound:
      id: client-unix
      unix-stream:
        path: near-channels-example-client-large-obj.sock

parties:
  - party: client
    connections:
      - channel-names:
          - client-tcp

        endpoints:
          - addr:
              tcp: '[::1]:8448'

      - channel-names:
          - client-unix

        endpoints:
          - addr:
              unix-stream: near-threads-example-client-large-obj.sock

  - party: server
    connections:
      - channel-names:
          - client-tcp

        endpoints:
          - addr:
              tcp: '[::1]:8338'

      - channel-names:
          - client-unix

        endpoints:
          - addr:
              unix-stream: near-threads-example-server-large-obj.sock

msg-authn: null
