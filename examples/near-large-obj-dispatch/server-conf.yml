default-inbound-authn:
  rules:
    - prin: client
      cred:
        unix: near-threads-example-client-large-obj.sock

    - prin: client
      cred:
        unsafe:
          ip: '[::1]:*'

  unsafe:
    allow-ip-addr-creds: true

default-outbound-authn:
  rules: []

channels:
  - inbound:
      id: server-tcp
      tcp:
        addr: '[::0]:8338'
        unsafe:
          allow-ip-addr-creds: true

  - inbound:
      id: server-unix
      unix-stream:
        path: near-threads-example-server-large-obj.sock

msg-authn: null
